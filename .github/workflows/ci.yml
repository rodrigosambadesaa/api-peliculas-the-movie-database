name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test, build and smoke-test Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JWT_SECRET: ci-only-secret-with-at-least-32-characters
      COOKIE_SECURE: "false"
      WEB_PORT: 8088

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build web application
        run: npm run build

      - name: Validate Docker Compose configuration
        run: docker compose config >/dev/null

      - name: Build Docker services
        run: docker compose build

      - name: Start Docker stack
        run: docker compose up -d --wait --wait-timeout 90

      - name: Smoke-test web and proxied API
        run: |
          curl --fail --show-error --silent http://127.0.0.1:${WEB_PORT}/ >/dev/null
          curl --fail --show-error --silent http://127.0.0.1:${WEB_PORT}/api/health

      - name: Show Docker status and logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color

      - name: Stop Docker stack
        if: always()
        run: docker compose down -v --remove-orphans
